# Local development services: `docker compose up -d` starts PostgreSQL and Mailpit; run the apps
# with ./mvnw and npm (see README).
# `docker compose --profile app up -d --build` also starts both apps in containers, at
# http://localhost:3000 (used by the end-to-end tests).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: employee_portal
      POSTGRES_USER: employee_portal
      POSTGRES_PASSWORD: employee_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_portal -d employee_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  backend:
    profiles: [app]
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/employee_portal
      MAIL_HOST: mailpit
      APP_BASE_URL: http://localhost:3000
      JWT_SECRET: compose-only-secret-not-for-production-0123456789
      COOKIE_SECURE: "false" # plain http inside Docker
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin12345!
      ADMIN_NAME: Local Admin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
