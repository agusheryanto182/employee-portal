# Local development services. Run the apps with ./mvnw and npm (see README).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: employee_portal
      POSTGRES_USER: employee_portal
      POSTGRES_PASSWORD: employee_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_portal -d employee_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  postgres-data:
