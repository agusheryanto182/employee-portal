spring:
  application:
    name: employee-portal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/employee_portal}
    username: ${DATABASE_USERNAME:employee_portal}
    password: ${DATABASE_PASSWORD:employee_portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:} # required: the app does not start without it
    issuer: employee-portal
    access-token-ttl: 15m
  refresh-token:
    ttl: 7d
    cookie-name: refresh_token
    cookie-secure: ${COOKIE_SECURE:true}
    reuse-grace: 30s
  login-rate-limit:
    max-failures: 5
    window: 15m
  account-token:
    invite-ttl: 24h
    reset-ttl: 1h
  mail:
    from: ${MAIL_FROM:Employee Portal <no-reply@employee-portal.local>}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_NAME:Administrator}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    mail:
      enabled: false # SMTP outages must not mark the API as down
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
