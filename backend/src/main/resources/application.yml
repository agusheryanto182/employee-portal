spring:
  application:
    name: employee-portal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/employee_portal}
    username: ${DATABASE_USERNAME:employee_portal}
    password: ${DATABASE_PASSWORD:employee_portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  forward-headers-strategy: framework

management:
  health:
    mail:
      enabled: false # SMTP outages must not mark the API as down
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
